name: Nightly Smoke Test

on:
  schedule:
    - cron: '0 18 * * *'  # Daily at 03:00 JST
  workflow_dispatch:

jobs:
  smoke:
    name: HTB API Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - name: Build
        run: npm run package
